# HTTPS + HTTP→HTTPS para diariozonasur (certbot emitió cert en /etc/letsencrypt/live/diariozonasur.cl)

server {
    listen 443 ssl http2;
    server_name diariozonasur.cl www.diariozonasur.cl;

    ssl_certificate /etc/letsencrypt/live/diariozonasur.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diariozonasur.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name api.diariozonasur.cl;

    ssl_certificate /etc/letsencrypt/live/diariozonasur.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diariozonasur.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/diariovirtual/backend/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name diariozonasur.cl www.diariozonasur.cl api.diariozonasur.cl;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
